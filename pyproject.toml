[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-radar-solana"
version = "0.1.0"
description = "Personal alert-only Solana memecoin radar using X, PumpPortal, DexScreener and Telegram"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.10,<4",
  "websockets>=13,<16",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]